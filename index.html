<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- THẺ QUAN TRỌNG NHẤT CHO ĐIỆN THOẠI: Chống vỡ giao diện và chặn tự động zoom khi bấm vào ô nhập liệu -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Hệ Thống Điểm Danh SAAS</title>
    
    <style>
        /* Xóa bỏ mọi khoảng trắng thừa của trình duyệt */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f2f5; 
            overflow: hidden; /* Chỉ cuộn bên trong ứng dụng, chặn thanh cuộn của trang web ngoài */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Định dạng Iframe lấp đầy 100% màn hình */
        .app-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Màn hình tải mượt mà (Nằm phía sau iframe) */
        .loading-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            text-align: center;
        }
        .loading-screen h3 {
            color: #1a73e8;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Chữ báo đang tải sẽ hiện ra trong vài giây đầu khi Google Script đang nạp -->
    <div class="loading-screen">
        <h3>⏳ Đang kết nối máy chủ...</h3>
    </div>

    <!-- ⚠️ DÁN ĐƯỜNG LINK WEB APP CỦA BẠN (CÓ ĐUÔI /exec) VÀO THUỘC TÍNH SRC BÊN DƯỚI -->
    <iframe 
        class="app-iframe" 
        src="https://script.google.com/macros/s/AKfycbz5HM5BVBrtOqYyXjFMSwARL4Hpo1v9-Hdai5Icuu1uUunyd6cgx9Q1Arn8Y5hi2K5ScA/exec" 
        allowfullscreen>
    </iframe>

</body>
</html>
